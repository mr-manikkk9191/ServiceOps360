name: Validate Salesforce metadata

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate (secret SFDX_AUTH_URL = sfdxAuthUrl of a validation org)
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > authUrl.txt
          sf org login sfdx-url --sfdx-url-file authUrl.txt --alias ci --set-default
          rm authUrl.txt
      - name: Validate deployment and run all local Apex tests (nothing is deployed)
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --target-org ci --wait 60
