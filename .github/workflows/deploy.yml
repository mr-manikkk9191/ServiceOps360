name: Deploy to demo org

on:
  workflow_dispatch: # manual trigger from the GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global @salesforce/cli
      - name: Authenticate (secret DEMO_SFDX_AUTH_URL)
        run: |
          echo "${{ secrets.DEMO_SFDX_AUTH_URL }}" > authUrl.txt
          sf org login sfdx-url --sfdx-url-file authUrl.txt --alias demo --set-default
          rm authUrl.txt
      - run: sf project deploy start --source-dir force-app --test-level RunLocalTests --target-org demo --wait 60
